<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.8rem;
            margin-top: 1.5rem;
        }
        .qr-card {
            text-align: center;
        }
        .qr-card img {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 320px;
        }
        @media (max-width: 480px) {
            .qr-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="tits-page-body">
    <header class="detail-header">
        <a href="/index.html" class="detail-header__link">&larr; Back to Home</a>
    </header>
    <div class="container">
        <h1>QR Codes</h1>
    </div>
    <div class="biopic">
        <h2>Scan to open the links</h2>
        <div class="qr-grid">
            <div class="qr-card">
                <h3>Site?</h3>
                <img src="/assets/img/RickRoll.png" alt="Rickroll QR code">
            </div>
            <div class="qr-card">
                <h3>Site?</h3>
                <img src="/assets/img/RickRoll.png" alt="Rickroll QR code">
            </div>
            <div class="qr-card">
                <h3>Site?</h3>
                <img src="/assets/img/SiteLink.png" alt="Site link QR code">
            </div>
            <div class="qr-card">

                <img src="/assets/img/RickRoll.png" alt="Rickroll QR code">

        </div>
    </div>

</body>
</html>
